<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор Металла | Ной Технологии</title>
<meta name="description" content="Быстрый и точный калькулятор веса металла: лист, круг, труба. Работает без интернета.">
<meta name="theme-color" content="#1e293b">
<!--
  © 2024 Ной Технологии. Все права защищены.
  Автор: Сухоруков Сергей Евгеньевич.
  Копирование, распространение и использование без письменного разрешения автора запрещено.
  Проект: metal-calc (Калькулятор веса металла)
  Версия: 1.0
  Контакт: Sukhorukov19807580@gmail.com
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background-color: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 400px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
.header p { font-size: 13px; color: #94a3b8; }
.card { background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
select, input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s; }
select:focus, input:focus { border-color: #38bdf8; }
.btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.result-box { margin-top: 24px; background: #0f172a; border-radius: 12px; padding: 20px; text-align: center; border: 2px solid #38bdf8; display: none; }
.result-box.active { display: block; animation: fadeIn 0.3s ease; }
.result-label { font-size: 14px; color: #94a3b8; margin-bottom: 4px; }
.result-value { font-size: 36px; font-weight: 900; color: #38bdf8; }
.result-unit { font-size: 18px; color: #94a3b8; font-weight: 600; }
.footer { margin-top: 30px; text-align: center; font-size: 12px; color: #475569; }
.ad-placeholder { margin-top: 20px; padding: 15px; background: #1e293b; border: 1px dashed #475569; border-radius: 8px; text-align: center; color: #64748b; font-size: 11px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⚙️ Калькулятор Металла</h1>
    <p>Быстрый расчет веса. Разработано: Ной Технологии</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Материал</label>
      <select id="material" onchange="updateDensity()">
        <option value="7850">Сталь (7850 кг/м³)</option>
        <option value="7900">Нержавейка (7900 кг/м³)</option>
        <option value="2700">Алюминий (2700 кг/м³)</option>
        <option value="8900">Медь (8900 кг/м³)</option>
        <option value="8500">Латунь (8500 кг/м³)</option>
        <option value="7200">Чугун (7200 кг/м³)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Форма проката</label>
      <select id="shape" onchange="toggleInputs()">
        <option value="sheet">Лист</option>
        <option value="round">Круглый пруток</option>
        <option value="pipe">Труба</option>
      </select>
    </div>

    <div class="form-group">
      <label id="label-dim1">Длина (мм)</label>
      <input type="number" id="dim1" placeholder="Например: 1000" inputmode="numeric">
    </div>

    <div class="form-group">
      <label id="label-dim2">Ширина (мм)</label>
      <input type="number" id="dim2" placeholder="Например: 500" inputmode="numeric">
    </div>

    <div class="form-group" id="group-dim3">
      <label id="label-dim3">Толщина (мм)</label>
      <input type="number" id="dim3" placeholder="Например: 5" inputmode="numeric">
    </div>

    <button class="btn" onclick="calculate()">Рассчитать вес</button>

    <div class="result-box" id="resultBox">
      <div class="result-label">Примерный вес:</div>
      <span class="result-value" id="resultValue">0.00</span>
      <span class="result-unit">кг</span>
    </div>

    <div class="ad-placeholder">
      📢 Здесь будет реклама (Яндекс.РСЯ)<br>
      Подключается после 100 посетителей в день
    </div>
  </div>

  <div class="footer">
    © 2024 Ной Технологии. Все права защищены.<br>
    Автор: Сухоруков Сергей Евгеньевич
  </div>
</div>

<script>
/* Ной Технологии - Калькулятор Металла v1.0 */
/* Автор: Сухоруков Сергей Евгеньевич */
/* Все права защищены. Копирование запрещено. */

let currentDensity = 7850;
const NOI_TECH_MARKER = "NOI-TECH-2024-SUKHORUKOV";

function updateDensity() {
  currentDensity = parseFloat(document.getElementById('material').value);
}

function toggleInputs() {
  const shape = document.getElementById('shape').value;
  const label1 = document.getElementById('label-dim1');
  const label2 = document.getElementById('label-dim2');
  const label3 = document.getElementById('label-dim3');
  const group3 = document.getElementById('group-dim3');

  if (shape === 'sheet') {
    label1.textContent = 'Длина (мм)';
    label2.textContent = 'Ширина (мм)';
    label3.textContent = 'Толщина (мм)';
    group3.classList.remove('hidden');
  } else if (shape === 'round') {
    label1.textContent = 'Длина (мм)';
    label2.textContent = 'Диаметр (мм)';
    group3.classList.add('hidden');
  } else if (shape === 'pipe') {
    label1.textContent = 'Длина (мм)';
    label2.textContent = 'Наружный диаметр (мм)';
    label3.textContent = 'Толщина стенки (мм)';
    group3.classList.remove('hidden');
  }
}

function calculate() {
  const shape = document.getElementById('shape').value;
  const d1 = parseFloat(document.getElementById('dim1').value);
  const d2 = parseFloat(document.getElementById('dim2').value);
  const d3 = parseFloat(document.getElementById('dim3').value);

  if (isNaN(d1) || isNaN(d2) || (shape !== 'round' && isNaN(d3))) {
    alert('Пожалуйста, заполните все числовые поля корректно.');
    return;
  }

  let volumeM3 = 0;

  if (shape === 'sheet') {
    volumeM3 = (d1 / 1000) * (d2 / 1000) * (d3 / 1000);
  } else if (shape === 'round') {
    const radiusM = (d2 / 2) / 1000;
    const lengthM = d1 / 1000;
    volumeM3 = Math.PI * (radiusM * radiusM) * lengthM;
  } else if (shape === 'pipe') {
    const outerRadiusM = (d2 / 2) / 1000;
    const innerRadiusM = outerRadiusM - (d3 / 1000);
    const lengthM = d1 / 1000;
    if (innerRadiusM <= 0) {
      alert('Толщина стенки не может быть больше или равна радиусу!');
      return;
    }
    volumeM3 = Math.PI * ((outerRadiusM * outerRadiusM) - (innerRadiusM * innerRadiusM)) * lengthM;
  }

  const weightKg = volumeM3 * currentDensity;
  
  document.getElementById('resultValue').textContent = weightKg.toFixed(2);
  document.getElementById('resultBox').classList.add('active');
  
  console.log(NOI_TECH_MARKER);
}

toggleInputs();
</script>
</body>
</html>
